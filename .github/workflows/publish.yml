name: Publish to PyPI

# Runs only when you publish a GitHub Release (not on every push)
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Safety check: release tag (e.g. v0.5.0) must match NaviLib/_version.py
      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(python -c "ns = {}; exec(open('NaviLib/_version.py').read(), ns); print(ns['__version__'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package=$PKG_VERSION tag=$TAG_VERSION"
          test "$PKG_VERSION" = "$TAG_VERSION"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/NaviLib/
    permissions:
      id-token: write   # lets GitHub prove its identity to PyPI (Trusted Publishing)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
