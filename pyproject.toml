[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NaviLib"
dynamic = ["version"]
description = "Readable, reproducible workflows for tabular analysis and machine learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Navid"}]
dependencies = [
    "numpy>=1.24", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.4",
    "joblib>=1.3", "matplotlib>=3.7", "seaborn>=0.13", "statsmodels>=0.14",
]

[project.optional-dependencies]
balance = ["imbalanced-learn>=0.12"]
explain = ["shap>=0.44"]
io = ["openpyxl>=3.1", "pyarrow>=14"]
notebook = ["jinja2>=3.1"]
dev = ["pytest>=8", "build>=1", "jinja2>=3.1"]

[tool.setuptools.dynamic]
version = {attr = "NaviLib._version.__version__"}

[tool.setuptools.packages.find]
include = ["NaviLib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
