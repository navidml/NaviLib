[build-system]
# setuptools 77+ understands the modern SPDX "license" field (PEP 639)
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "NaviLib"
dynamic = ["version"]
description = "Readable, reproducible workflows for tabular analysis and machine learning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Navid Bordbar", email = "navidbordbar2004@gmail.com"}]
keywords = ["data-cleaning", "feature-engineering", "machine-learning", "statistics", "tabular-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.4",
    "joblib>=1.3", "matplotlib>=3.7", "seaborn>=0.13", "statsmodels>=0.14",
]

[project.urls]
Homepage = "https://github.com/navidml/NaviLib"
Documentation = "https://github.com/navidml/NaviLib/blob/main/docs/API.md"
Issues = "https://github.com/navidml/NaviLib/issues"

[project.optional-dependencies]
balance = ["imbalanced-learn>=0.12"]
explain = ["shap>=0.44"]
io = ["openpyxl>=3.1", "pyarrow>=14"]
notebook = ["jinja2>=3.1"]
dev = ["pytest>=8", "build>=1", "twine>=6", "jinja2>=3.1"]

[tool.setuptools.dynamic]
version = {attr = "NaviLib._version.__version__"}

[tool.setuptools.packages.find]
include = ["NaviLib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
